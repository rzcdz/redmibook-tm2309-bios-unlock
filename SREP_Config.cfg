# SREP config for Redmi Book Pro 16 2024 / TM2309 / RMAMT6B0P0B0B
#
# Problem: the Xiaomi custom Setup UI shows only 5 menus
#          (Main / Security / Power / Boot / Exit).
#          The "Advanced" FormSet (C6D4769E-7F48-4D2A-98E9-87ADCCF35CCC)
#          exists in the firmware but has no menu entry.
#
# Finding: SetupUtilityApp (file GUID 3935B0A1-A182-4887-BC56-675528E78877)
#          contains two hard-coded GUID arrays:
#            array A @ 0x25B0 : Main, Security, Power, Boot, Exit   (the 5 menus)
#            array B @ 0x2610 : Main, Advanced, Security, Power, Boot, Exit
#          Array A matches the visible menu exactly, in order.
#
# This config replaces the "Boot" slot in array A with the "Advanced"
# GUID, so the Advanced page should appear in the left menu.
# The Boot menu is temporarily unavailable (F12 still works).
#
# Inside Advanced -> PCH-IO Configuration -> "State After G3"
#   set it to "S0 State" to power on when AC is applied.

Op SuppressIfPatcher

Op LoadFromFV
SetupUtilityApp

Op Patch
Pattern
0983062DAC12AB4596009187513CCDD8266493B604FB7B4AAA51FD49397CDC01000000000000000000000000000000001AB0E0C17E60754BB8BB0631ECFAACF2
9E76D4C6487F2A4D98E987ADCCF35CCC266493B604FB7B4AAA51FD49397CDC01000000000000000000000000000000001AB0E0C17E60754BB8BB0631ECFAACF2

Op Exec
